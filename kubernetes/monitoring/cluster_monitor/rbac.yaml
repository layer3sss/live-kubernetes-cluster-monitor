apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-monitor-sa
  namespace: cluster-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-monitor-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "namespaces", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-monitor-binding
subjects:
  - kind: ServiceAccount
    name: cluster-monitor-sa
    namespace: cluster-monitor
roleRef:
  kind: ClusterRole
  name: cluster-monitor-role
  apiGroup: rbac.authorization.k8s.io
