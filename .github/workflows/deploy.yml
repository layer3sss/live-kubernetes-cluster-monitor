name: Build & Deploy Cluster Monitor

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        run: kubectl apply -f kubernetes/monitoring/cluster_monitor/

      - name: Restart deployment (nieuwe image ophalen)
        run: kubectl rollout restart deployment/cluster-monitor -n cluster-monitor

      - name: Wacht op uitrol
        run: kubectl rollout status deployment/cluster-monitor -n cluster-monitor --timeout=90s
